services:
  - type: web
    name: marketglobe-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    releaseCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --timeout 180 --workers 2
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: marketglobe-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: marketglobe-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://marketglobe-web.onrender.com
      # Email / SMTP for OTP + password-reset emails. Provider-agnostic: config comes
# from env vars so you can switch providers without code changes.
#
# Recommended: Brevo (ex-Sendinblue) - free 300 emails/day, signup works in most
# regions. Steps:
#   1. app.brevo.com -> Sign up.
#   2. SMTP & API -> generate an SMTP key. SMTP login is shown there too
#      (e.g. an email address like "marketglobe@smtp-relay.brevo.com").
#   3. Senders -> add + verify your "from" address (confirmation email; no
#      domain ownership needed).
#   4. In Render dashboard -> Environment set:
#        EMAIL_HOST_USER     = Brevo SMTP login
#        EMAIL_HOST_PASSWORD = Brevo SMTP key
#        DEFAULT_FROM_EMAIL  = your verified "from" address
#
# Gmail fallback (fine for casual use, NOT for scale - Google caps ~500/day):
#   EMAIL_HOST_USER=you@gmail.com, EMAIL_HOST_PASSWORD=<App Password>,
#   DEFAULT_FROM_EMAIL=you@gmail.com
#
# If EMAIL_HOST_USER is blank, codes print to the server log (console backend).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Admin superuser auto-created at startup from these (log into /admin/
      # with them). Fill in the values in the Render dashboard.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

databases:
  - name: marketglobe-db
    plan: free
    databaseName: marketglobe

# Scheduled price refresh (keeps /api/assets/ live). Free Render tiers sleep
# when idle; this wakes the DB-backed data and keeps last_price current.
jobs:
  - name: marketglobe-price-refresh
    plan: free
    runtime: python
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py refresh_prices
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketglobe-db
          property: connectionString
