services:
  - type: web
    name: marketglobe-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --timeout 180 --workers 2
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: marketglobe-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: marketglobe-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://marketglobe-web.onrender.com
      # Email / SMTP for OTP + password-reset emails via SendGrid.
      # The ONLY secret needed is EMAIL_HOST_PASSWORD (the SendGrid API key):
      # paste it in Render dashboard → Environment → EMAIL_HOST_PASSWORD and
      # Render redeploys. Codes went to the server log until that is set.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: apikey
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: MarketGlobe <no-reply@marketglobe.app>
      # Admin superuser auto-created at startup from these (log into /admin/
      # with them). Fill in the values in the Render dashboard.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

databases:
  - name: marketglobe-db
    plan: free
    databaseName: marketglobe

# Scheduled price refresh (keeps /api/assets/ live). Free Render tiers sleep
# when idle; this wakes the DB-backed data and keeps last_price current.
jobs:
  - name: marketglobe-price-refresh
    plan: free
    runtime: python
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py refresh_prices
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketglobe-db
          property: connectionString
