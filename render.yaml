services:
  - type: web
    name: marketglobe-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: marketglobe-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: marketglobe-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://marketglobe-web.onrender.com

databases:
  - name: marketglobe-db
    plan: free
    databaseName: marketglobe
